name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Unit tests. These run on a plain JVM and cover the pure logic layers
  #    (file naming, error classification, retry policy, credential redaction).
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The GitHub-hosted Ubuntu image already contains a complete Android SDK
      # (build-tools 35.0.0, platform android-35, platform-tools). Using it directly avoids the
      # third-party `android-actions/setup-android` action entirely - that step was failing in this
      # repository, and pinning to the runner's own SDK removes both the failure and a supply-chain
      # dependency. See the "Set up Android SDK" step below for how the path is resolved.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          CANDIDATE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1 || true)"
          if [ -z "$CANDIDATE" ]; then
            echo "::error::No usable Android SDK command-line tools found under '$SDK'."
            ls -la "$SDK" 2>/dev/null || true
            exit 1
          fi
          echo "Using Android SDK: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CANDIDATE" >> "$GITHUB_PATH"
          "$CANDIDATE/sdkmanager" --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testGenericDebugUnitTest --stacktrace --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Static analysis. Reported but never blocking: lint findings on a project
  #    this size are noisy and must not be able to fail a release.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          CANDIDATE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1 || true)"
          if [ -z "$CANDIDATE" ]; then
            echo "::error::No usable Android SDK command-line tools found under '$SDK'."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CANDIDATE" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew :app:lintGenericRelease --stacktrace --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Build debug + release APKs, verify them, and publish checksums.
  # ---------------------------------------------------------------------------
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          CANDIDATE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1 || true)"
          if [ -z "$CANDIDATE" ]; then
            echo "::error::No usable Android SDK command-line tools found under '$SDK'."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CANDIDATE" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify required SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          for i in 1 2 3; do
            if "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"; then
              break
            fi
            echo "sdkmanager attempt $i failed; retrying"
            sleep 10
          done
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      # Signing is optional. When the secrets are absent the release build is
      # still produced, just unsigned, so forks and PRs keep working.
      - name: Configure signing
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$KEY_STORE_PASSWORD"
              echo "keyAlias=$ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets found - building unsigned release APKs."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APKs
        run: ./gradlew :app:assembleGenericDebug --stacktrace --no-daemon

      - name: Build release APKs
        run: ./gradlew :app:assembleGenericRelease --stacktrace --no-daemon

      - name: Verify APKs
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKS=(app/build/outputs/apk/generic/release/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::No release APKs were produced"
            exit 1
          fi
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | head -1 || true)"
          for apk in "${APKS[@]}"; do
            echo "--- $apk ---"
            ls -lh "$apk"
            # Fails if the archive is malformed.
            unzip -tqq "$apk"
            if [ -n "$AAPT2" ]; then
              echo -n "package: "
              "$AAPT2" dump packagename "$apk"
            fi
          done

      - name: Calculate SHA-256 checksums
        run: |
          cd app/build/outputs/apk/generic/release
          sha256sum *.apk | tee SHA256SUMS.txt
          cd -

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: snapnet-debug-apks
          path: app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: snapnet-release-apks
          path: |
            app/build/outputs/apk/generic/release/*.apk
            app/build/outputs/apk/generic/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Publish a GitHub Release when a v* tag is pushed.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [ build ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: snapnet-release-apks
          path: apks

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*
          generate_release_notes: true
          draft: false
          prerelease: false
