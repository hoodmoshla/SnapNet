name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"
  # A single universal APK (every ABI in one file) is what gets published, so the artifact a user
  # downloads from the Releases page is directly installable.
  RELEASE_ABIS: "arm64-v8a;armeabi-v7a;x86;x86_64"
  # The permanent SnapNet signing certificate. Every published APK must be signed with exactly this
  # key: Android refuses to install an update signed by a different one, so a rotated key would
  # strand every existing installation. CI fails if a build is signed with anything else.
  # Regenerate with tools/generate-keystore.sh only if this is a deliberate, communicated break.
  EXPECTED_SIGNING_CERT_SHA256: "31:60:36:6E:4E:39:07:8C:C0:D5:88:99:E1:41:68:07:79:B1:23:1E:48:09:01:E7:0C:55:A6:F2:06:C0:5E:57"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Unit tests. These run on a plain JVM and cover the pure logic layers
  #    (file naming, error classification, retry policy, credential redaction).
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The GitHub-hosted Ubuntu image already contains a complete Android SDK
      # (build-tools 35.0.0, platform android-35, platform-tools), so it is used directly instead of
      # depending on a third-party setup action.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          CANDIDATE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1 || true)"
          if [ -z "$CANDIDATE" ]; then
            echo "::error::No usable Android SDK command-line tools found under '$SDK'."
            ls -la "$SDK" 2>/dev/null || true
            exit 1
          fi
          echo "Using Android SDK: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CANDIDATE" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testGenericDebugUnitTest --stacktrace --no-daemon --no-configuration-cache

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Static analysis. Reported but never blocking.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          CANDIDATE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1 || true)"
          if [ -z "$CANDIDATE" ]; then
            echo "::error::No usable Android SDK command-line tools found under '$SDK'."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CANDIDATE" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew :app:lintGenericRelease --stacktrace --no-daemon --no-configuration-cache

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Build ONE universal, signed release APK.
  # ---------------------------------------------------------------------------
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: [ test ]
    outputs:
      version: ${{ steps.version.outputs.name }}
      tag: ${{ steps.version.outputs.tag }}
      cert_sha256: ${{ steps.cert.outputs.sha256 }}
      apk_sha256: ${{ steps.cert.outputs.apk_sha256 }}
      apk_name: ${{ steps.cert.outputs.apk_name }}
      apk_size: ${{ steps.cert.outputs.apk_size }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          CANDIDATE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1 || true)"
          if [ -z "$CANDIDATE" ]; then
            echo "::error::No usable Android SDK command-line tools found under '$SDK'."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CANDIDATE" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify required SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          for i in 1 2 3; do
            if "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"; then
              break
            fi
            echo "sdkmanager attempt $i failed; retrying"
            sleep 10
          done

      # The release APK is published to users, so it must be signed with the permanent keystore.
      # All four values come from repository secrets and are never written into the repository.
      - name: Configure signing
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${SIGNING_KEY:-}" ]        && MISSING="$MISSING SIGNING_KEY"
          [ -z "${KEY_STORE_PASSWORD:-}" ] && MISSING="$MISSING KEY_STORE_PASSWORD"
          [ -z "${ALIAS:-}" ]              && MISSING="$MISSING ALIAS"
          [ -z "${KEY_PASSWORD:-}" ]       && MISSING="$MISSING KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::warning::Missing repository secret(s):$MISSING"
            echo "::warning::The release APK will be unsigned and will NOT be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"

          # Validate before spending minutes on the build: a truncated SIGNING_KEY, a wrong password
          # or a mismatched alias should be reported here rather than surfacing as an unsigned APK.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass "$KEY_STORE_PASSWORD" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened."
            echo "::error::Check that SIGNING_KEY is the base64 of the .jks file, that KEY_STORE_PASSWORD is its password, and that ALIAS exists in it."
            exit 1
          fi
          KEYSTORE_CERT="$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass "$KEY_STORE_PASSWORD" -alias "$ALIAS" 2>/dev/null \
                 | awk '/SHA256:/{sub(/^[ \t]*SHA256: /,""); gsub(/[ \t\r]/,""); print; exit}')"
          echo "Keystore signer certificate SHA-256: $KEYSTORE_CERT"

          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          FILE=buildSrc/src/main/kotlin/Version.kt
          KIND="$(grep -oE 'Version\.(Alpha|Beta|ReleaseCandidate|Stable)' "$FILE" | tail -1 | sed 's/Version\.//')"
          MAJ="$(grep -oE 'versionMajor = [0-9]+' "$FILE" | tail -1 | grep -oE '[0-9]+')"
          MIN="$(grep -oE 'versionMinor = [0-9]+' "$FILE" | tail -1 | grep -oE '[0-9]+')"
          PAT="$(grep -oE 'versionPatch = [0-9]+' "$FILE" | tail -1 | grep -oE '[0-9]+')"
          BLD="$(grep -oE 'versionBuild = [0-9]+' "$FILE" | tail -1 | grep -oE '[0-9]+' || echo 0)"
          case "$KIND" in
            Stable)           NAME="$MAJ.$MIN.$PAT" ;;
            Alpha)            NAME="$MAJ.$MIN.$PAT-alpha.$BLD" ;;
            Beta)             NAME="$MAJ.$MIN.$PAT-beta.$BLD" ;;
            ReleaseCandidate) NAME="$MAJ.$MIN.$PAT-rc.$BLD" ;;
            *) echo "::error::Could not determine the version kind"; exit 1 ;;
          esac
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $NAME"

      # -PnoSplits turns off per-ABI APK splits and -PABI_FILTERS lists every ABI, which produces a
      # single universal APK instead of five.
      - name: Build universal release APK
        run: |
          ./gradlew :app:assembleGenericRelease \
            -PnoSplits \
            -PABI_FILTERS="$RELEASE_ABIS" \
            --stacktrace --no-daemon --no-configuration-cache

      - name: Verify APK and compute fingerprints
        id: cert
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKS=(app/build/outputs/apk/generic/release/*.apk)
          if [ ${#APKS[@]} -ne 1 ]; then
            echo "::error::Expected exactly one APK, found ${#APKS[@]}: ${APKS[*]}"
            exit 1
          fi
          APK="${APKS[0]}"
          echo "APK: $APK"
          ls -lh "$APK"

          # Fails if the archive is malformed.
          unzip -tqq "$APK"

          # apksigner is the canonical verifier: it validates the v1/v2/v3/v3.1 signature schemes
          # directly, so it does not depend on the presence of META-INF/MANIFEST.MF (a modern,
          # v2/v3-signed APK legitimately has no such file). Its output also carries the signer
          # certificate digest, which is what the release notes publish.
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi
          echo "Using $APKSIGNER"

          set +e
          VERIFY_OUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          VERIFY_RC=$?
          set -e
          echo "$VERIFY_OUT"

          if [ "$VERIFY_RC" -ne 0 ]; then
            if printf '%s' "$VERIFY_OUT" | grep -qE "DOES NOT VERIFY|Missing META-INF/MANIFEST.MF"; then
              echo "::error::The release APK is not signed, so it cannot be installed or published."
              echo "::error::That means the signing secrets were not available to this job."
              echo "::error::Add SIGNING_KEY (base64 of the keystore), KEY_STORE_PASSWORD, ALIAS and KEY_PASSWORD as repository secrets."
            else
              echo "::error::apksigner could not verify the APK signature."
            fi
            echo "::error::apksigner said: $(printf '%s' "$VERIFY_OUT" | tail -n 1)"
            exit 1
          fi
          echo "APK signature verified."

          # Report every scheme apksigner validated, and require a modern one. v1-only signing is
          # weak, and an APK with no scheme at all would not have verified in the first place.
          for scheme in v1 v2 "v3" "v3.1" v4; do
            state="$(printf '%s' "$VERIFY_OUT" \
              | sed -n "s/.*Verified using ${scheme} scheme[^:]*: \(true\|false\).*/\1/p" | head -1)"
            echo "  signature scheme ${scheme}: ${state:-not reported}"
          done
          if ! printf '%s' "$VERIFY_OUT" | grep -qE "Verified using v(2|3)(\.1)? scheme[^:]*: true"; then
            echo "::error::The APK is not signed with a modern scheme (v2/v3); refusing to publish."
            exit 1
          fi

          CERT_SHA="$(printf '%s' "$VERIFY_OUT" \
            | awk -F'SHA-256 digest: ' '/SHA-256 digest:/{gsub(/[ \t\r]/,"",$2); print $2; exit}')"

          # apksigner prints the digest as lowercase hex with no separators; the expected value is
          # stored in colon-separated form. Normalise both before comparing.
          EXPECTED_FP="$(printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" | tr 'A-F' 'a-f' | tr -d ' \t')"
          ACTUAL_FP="$(printf '%s' "$CERT_SHA" | tr 'A-F' 'a-f' | sed 's/\(..\)/\1:/g; s/:$//')"
          echo "signer certificate SHA-256: ${ACTUAL_FP:-<none>}"
          if [ "$ACTUAL_FP" != "$EXPECTED_FP" ]; then
            echo "::error::The APK is signed with an unexpected certificate."
            echo "::error::  expected: $EXPECTED_FP"
            echo "::error::  actual:   ${ACTUAL_FP:-<none>}"
            echo "::error::Publishing this build would leave existing installations unable to update."
            exit 1
          fi
          echo "Signer certificate matches the permanent SnapNet key."
          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          APK_NAME="$(basename "$APK")"
          APK_SIZE="$(du -h "$APK" | awk '{print $1}')"

          for kv in "cert=$CERT_SHA" "apk_sha=$APK_SHA" "name=$APK_NAME" "size=$APK_SIZE"; do
            echo "computed ${kv%%=*}: ${kv#*=}"
          done

          {
            echo "sha256=$CERT_SHA"
            echo "apk_sha256=$APK_SHA"
            echo "apk_name=$APK_NAME"
            echo "apk_size=$APK_SIZE"
          } >> "$GITHUB_OUTPUT"

          {
            echo "APK: $APK_NAME"
            echo "APK SHA-256: $APK_SHA"
            echo "Signer certificate SHA-256: $CERT_SHA"
          } > "$RUNNER_TEMP/fingerprints.txt"

          # The artifact keeps only the APK so that it downloads as a flat, directly installable file.
          mkdir -p release-apk
          cp "$APK" release-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapnet-apk
          path: release-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Publish the APK to GitHub Releases (raw .apk, not a zip).
  #    Existing releases are untouched, so every published version stays available.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [ build ]
    if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ensure the APK is signed before publishing
        env:
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" != "true" ]; then
            echo "::error::Refusing to publish an unsigned APK."
            echo "::error::Add the SIGNING_KEY, KEY_STORE_PASSWORD, ALIAS and KEY_PASSWORD repository secrets so SnapNet releases are signed with the permanent keystore and can be installed as an update."
            exit 1
          fi
          echo "APK is signed; proceeding to publish."

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: snapnet-apk
          path: apk

      - name: Compose release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CERT_SHA256: ${{ needs.build.outputs.cert_sha256 }}
          APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          APK_SIZE: ${{ needs.build.outputs.apk_size }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          نسخة SnapNet $VERSION — تنزيل الفيديو والصوت من Android.

          - اسم الحزمة (Application ID): \`com.snapnet\`
          - اسم الملف: \`$APK_NAME\`
          - الحجم: $APK_SIZE
          - التوقيع الرقمي: Keystore دائم (SHA-256: $CERT_SHA256)
          - بصمة ملف الـAPK (SHA-256): \`$APK_SHA256\`

          ### التثبيت
          نزّل ملف \`.apk\` المرفق مباشرة وثبّته (فعّل "تثبيت من مصادر غير معروفة" إن طُلب منك).
          التوقيع ثابت لكل الإصدارات، لذلك يمكن تثبيت الإصدار الجديد فوق القديم بدون حذف التطبيق.

          ### التحقق من السلامة
          \`\`\`
          sha256sum $APK_NAME
          # يجب أن يساوي:
          # $APK_SHA256
          \`\`\`
          EOF
          cat notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: SnapNet ${{ needs.build.outputs.version }}
          body_path: notes.md
          files: apk/*.apk
          draft: false
          prerelease: false
          make_latest: true
