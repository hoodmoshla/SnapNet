name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"
  # The permanent SnapNet signing certificate. Every published APK must be signed with exactly this
  # key: Android refuses to install an update signed by a different one, so a rotated key would
  # strand every existing installation. CI fails if a build is signed with anything else.
  EXPECTED_SIGNING_CERT_SHA256: "31:60:36:6E:4E:39:07:8C:C0:D5:88:99:E1:41:68:07:79:B1:23:1E:48:09:01:E7:0C:55:A6:F2:06:C0:5E:57"
  # One APK per ABI is published. Each contains the native libraries for that ABI only, which keeps
  # the download small; a universal APK would carry all four and be roughly four times the size.
  RELEASE_ABIS: "arm64-v8a armeabi-v7a x86 x86_64"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Unit tests - plain JVM, covering file naming, error classification,
  #    retry policy and credential redaction.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The GitHub-hosted Ubuntu image already contains a complete Android SDK
      # (build-tools 35.0.0, platform android-35, platform-tools).
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          CANDIDATE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1 || true)"
          if [ -z "$CANDIDATE" ]; then
            echo "::error::No usable Android SDK command-line tools found under '$SDK'."
            ls -la "$SDK" 2>/dev/null || true
            exit 1
          fi
          echo "Using Android SDK: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CANDIDATE" >> "$GITHUB_PATH"
          "$CANDIDATE/sdkmanager" --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testGenericDebugUnitTest --stacktrace --no-daemon --no-configuration-cache

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Static analysis. Strict: a lint finding fails the job.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          CANDIDATE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1 || true)"
          if [ -z "$CANDIDATE" ]; then
            echo "::error::No usable Android SDK command-line tools found under '$SDK'."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CANDIDATE" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew :app:lintGenericRelease --stacktrace --no-daemon --no-configuration-cache

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Build four signed release APKs, one per ABI, and validate each of them.
  # ---------------------------------------------------------------------------
  build:
    name: Build release APKs
    runs-on: ubuntu-latest
    needs: [ test ]
    outputs:
      version: ${{ steps.version.outputs.name }}
      tag: ${{ steps.version.outputs.tag }}
      cert_sha256: ${{ steps.verify.outputs.cert_sha256 }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          CANDIDATE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1 || true)"
          if [ -z "$CANDIDATE" ]; then
            echo "::error::No usable Android SDK command-line tools found under '$SDK'."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CANDIDATE" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify required SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          for i in 1 2 3; do
            if "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"; then
              break
            fi
            echo "sdkmanager attempt $i failed; retrying"
            sleep 10
          done

      # The release APKs are published to users, so they must be signed with the permanent keystore.
      # All four values come from repository secrets and are never written into the repository.
      - name: Configure signing
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${SIGNING_KEY:-}" ]        && MISSING="$MISSING SIGNING_KEY"
          [ -z "${KEY_STORE_PASSWORD:-}" ] && MISSING="$MISSING KEY_STORE_PASSWORD"
          [ -z "${ALIAS:-}" ]              && MISSING="$MISSING ALIAS"
          [ -z "${KEY_PASSWORD:-}" ]       && MISSING="$MISSING KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::warning::Missing repository secret(s):$MISSING"
            echo "::warning::The release APKs will be unsigned and will NOT be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"

          # Validate before spending minutes on the build: a truncated SIGNING_KEY, a wrong password
          # or a mismatched alias should be reported here rather than surfacing as unsigned APKs.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass "$KEY_STORE_PASSWORD" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened."
            echo "::error::Check that SIGNING_KEY is the base64 of the .jks file, that KEY_STORE_PASSWORD is its password, and that ALIAS exists in it."
            exit 1
          fi
          KEYSTORE_CERT="$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass "$KEY_STORE_PASSWORD" -alias "$ALIAS" 2>/dev/null \
                 | awk '/SHA256:/{sub(/^[ \t]*SHA256: /,""); gsub(/[ \t\r]/,""); print; exit}')"
          echo "Keystore signer certificate SHA-256: $KEYSTORE_CERT"

          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          FILE=buildSrc/src/main/kotlin/Version.kt
          KIND="$(grep -oE 'Version\.(Alpha|Beta|ReleaseCandidate|Stable)' "$FILE" | tail -1 | sed 's/Version\.//')"
          MAJ="$(grep -oE 'versionMajor = [0-9]+' "$FILE" | tail -1 | grep -oE '[0-9]+')"
          MIN="$(grep -oE 'versionMinor = [0-9]+' "$FILE" | tail -1 | grep -oE '[0-9]+')"
          PAT="$(grep -oE 'versionPatch = [0-9]+' "$FILE" | tail -1 | grep -oE '[0-9]+')"
          BLD="$(grep -oE 'versionBuild = [0-9]+' "$FILE" | tail -1 | grep -oE '[0-9]+' || echo 0)"
          case "$KIND" in
            Stable)           NAME="$MAJ.$MIN.$PAT" ;;
            Alpha)            NAME="$MAJ.$MIN.$PAT-alpha.$BLD" ;;
            Beta)             NAME="$MAJ.$MIN.$PAT-beta.$BLD" ;;
            ReleaseCandidate) NAME="$MAJ.$MIN.$PAT-rc.$BLD" ;;
            *) echo "::error::Could not determine the version kind"; exit 1 ;;
          esac
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $NAME"

      # ABI splits are configured in app/build.gradle.kts, so this produces one APK per
      # architecture and no universal APK.
      - name: Build per-ABI release APKs
        run: |
          ./gradlew :app:assembleGenericRelease \
            --stacktrace --no-daemon --no-configuration-cache

      - name: Verify APKs and compute fingerprints
        id: verify
        run: |
          set -euo pipefail
          shopt -s nullglob

          APKS=(app/build/outputs/apk/generic/release/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::No release APKs were produced."
            exit 1
          fi

          # No universal APK may ever be published: it would carry every ABI.
          for apk in "${APKS[@]}"; do
            case "$(basename "$apk")" in
              *universal*)
                echo "::error::A universal APK was produced ($(basename "$apk")); only per-ABI APKs may be released."
                exit 1
                ;;
            esac
          done

          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | head -1 || true)"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -1 || true)"
          if [ -z "$AAPT2" ] || [ -z "$APKSIGNER" ]; then
            echo "::error::aapt2 or apksigner was not found in the Android SDK."
            exit 1
          fi
          echo "Using $APKSIGNER"

          # expected ELF e_machine (little-endian bytes) for each ABI
          machine_of() {
            case "$1" in
              arm64-v8a)   echo "b700" ;;
              armeabi-v7a) echo "2800" ;;
              x86)         echo "0300" ;;
              x86_64)      echo "3e00" ;;
              *)           echo "?" ;;
            esac
          }

          EXPECTED_FP="$(printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" | tr 'A-F' 'a-f' | tr -d ' \t')"
          mkdir -p release-apk
          rm -rf /tmp/apkcheck && mkdir -p /tmp/apkcheck

          seen_abis=""
          for apk in "${APKS[@]}"; do
            name="$(basename "$apk")"
            echo
            echo "================ $name ================"
            ls -lh "$apk"

            abi="$(printf '%s' "$name" \
              | sed -nE 's/^SnapNet-[0-9A-Za-z.\-]+-(arm64-v8a|armeabi-v7a|x86_64|x86)-release\.apk$/\1/p')"
            if [ -z "$abi" ]; then
              echo "::error::Unexpected APK file name '$name'; expected SnapNet-<version>-<abi>-release.apk"
              exit 1
            fi
            case " $RELEASE_ABIS " in
              *" $abi "*) ;;
              *) echo "::error::$name reports ABI '$abi' which is not one of the four published ABIs."; exit 1 ;;
            esac
            case " $seen_abis " in
              *" $abi "*) echo "::error::Two APKs were produced for the same ABI ($abi)."; exit 1 ;;
            esac
            seen_abis="$seen_abis $abi"

            # 1. archive integrity
            unzip -tqq "$apk" || { echo "::error::$name is not a readable zip archive."; exit 1; }

            # 2. manifest / resource table parse
            echo -n "  badging: "; "$AAPT2" dump badging "$apk" | head -1
            if ! "$AAPT2" dump badging "$apk" > /dev/null 2>&1; then
              echo "::error::$name has an unreadable manifest or resource table."
              exit 1
            fi

            # 3. signature, using apksigner (independent of META-INF/MANIFEST.MF presence)
            set +e
            VERIFY_OUT="$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1)"
            VERIFY_RC=$?
            set -e
            echo "$VERIFY_OUT" | sed 's/^/  /'
            if [ "$VERIFY_RC" -ne 0 ]; then
              if printf '%s' "$VERIFY_OUT" | grep -qE "DOES NOT VERIFY|Missing META-INF/MANIFEST.MF"; then
                echo "::error::$name is not signed, so it cannot be installed or published."
                echo "::error::That means the signing secrets were not available to this job."
              else
                echo "::error::apksigner could not verify the signature of $name."
              fi
              echo "::error::apksigner said: $(printf '%s' "$VERIFY_OUT" | tail -n 1)"
              exit 1
            fi

            # 4. modern signature scheme present
            for scheme in "v2" "v3" "v3.1"; do
              state="$(printf '%s' "$VERIFY_OUT" \
                | sed -n "s/.*Verified using ${scheme} scheme[^:]*: \(true\|false\).*/\1/p" | head -1)"
              echo "  signature scheme ${scheme}: ${state:-not reported}"
            done
            if ! printf '%s' "$VERIFY_OUT" | grep -qE "Verified using v(2|3)(\.1)? scheme[^:]*: true"; then
              echo "::error::$name is not signed with a modern scheme (v2/v3)."
              exit 1
            fi

            # 5. signer certificate must be the permanent SnapNet key
            CERT_SHA="$(printf '%s' "$VERIFY_OUT" \
              | awk -F'SHA-256 digest: ' '/SHA-256 digest:/{gsub(/[ \t\r]/,"",$2); print $2; exit}')"
            ACTUAL_FP="$(printf '%s' "$CERT_SHA" | tr 'A-F' 'a-f' | sed 's/\(..\)/\1:/g; s/:$//')"
            echo "  signer certificate SHA-256: ${ACTUAL_FP:-<none>}"
            if [ "$ACTUAL_FP" != "$EXPECTED_FP" ]; then
              echo "::error::$name is signed with an unexpected certificate."
              echo "::error::  expected: $EXPECTED_FP"
              echo "::error::  actual:   ${ACTUAL_FP:-<none>}"
              echo "::error::Publishing this build would leave existing installations unable to update."
              exit 1
            fi

            # 6. the APK must contain exactly one ABI, and it must be the one its name claims
            ABIS_IN_APK="$(unzip -Z1 "$apk" | grep -oE '^lib/[^/]+/' | sed 's|^lib/||; s|/$||' | sort -u | tr '\n' ' ' | sed 's/ $//')"
            abi_count="$(printf '%s' "$ABIS_IN_APK" | wc -w)"
            echo "  ABIs inside: '${ABIS_IN_APK}'"
            if [ "$abi_count" -ne 1 ]; then
              echo "::error::$name contains $abi_count ABIs ('$ABIS_IN_APK'); it must contain only '$abi'."
              exit 1
            fi
            if [ "$ABIS_IN_APK" != "$abi" ]; then
              echo "::error::$name is named '$abi' but contains '$ABIS_IN_APK' libraries."
              exit 1
            fi

            # 7. every ELF in lib/ must be ET_DYN (Android rejects ET_EXEC) and match the ABI
            want_machine="$(machine_of "$abi")"
            work="/tmp/apkcheck/$abi"
            mkdir -p "$work"
            ( cd "$work" && unzip -q -o "$OLDPWD/$apk" 'lib/*' 2>/dev/null || unzip -q -o "$(realpath "$apk" 2>/dev/null || echo "$apk")" 'lib/*' )
            elf_fail=0
            while IFS= read -r so; do
              etype="$(od -An -tu2 -j16 -N2 "$so" | tr -d ' ')"
              emach="$(od -An -tx1 -j18 -N2 "$so" | tr -d ' ')"
              case "$etype" in
                3) ;;                       # ET_DYN - required
                2) echo "::error::${so##*/} is ET_EXEC; Android refuses to install a package containing a non-PIE library."; elf_fail=1; continue ;;
                *) continue ;;              # not an ELF (e.g. libpython.zip.so) - copied as data
              esac
              if [ "$emach" != "$want_machine" ]; then
                echo "::error::${so##*/} is built for machine $emach but $abi requires $want_machine."
                elf_fail=1
              fi
            done < <(find "$work/lib" -name '*.so' | sort)
            if [ "$elf_fail" -ne 0 ]; then
              exit 1
            fi
            echo "  native libraries: all ELF objects are ET_DYN and match $abi"

            cp "$apk" release-apk/
          done

          # every requested ABI must have been produced
          for abi in $RELEASE_ABIS; do
            case " $seen_abis " in
              *" $abi "*) ;;
              *) echo "::error::No APK was produced for $abi."; exit 1 ;;
            esac
          done

          echo
          echo "Verified ${#APKS[@]} APKs:"
          ( cd release-apk && sha256sum *.apk | tee SHA256SUMS.txt )

          echo "cert_sha256=$(printf '%s' "$EXPECTED_FP")" >> "$GITHUB_OUTPUT"

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: snapnet-apks
          path: |
            release-apk/*.apk
            release-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Publish the four APKs to GitHub Releases (raw .apk files, not a zip).
  #    Previous releases are left untouched.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [ build ]
    if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ensure the APKs are signed before publishing
        env:
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" != "true" ]; then
            echo "::error::Refusing to publish unsigned APKs."
            echo "::error::Add the SIGNING_KEY, KEY_STORE_PASSWORD, ALIAS and KEY_PASSWORD repository secrets so SnapNet releases are signed with the permanent keystore and can be installed as an update."
            exit 1
          fi
          echo "APKs are signed; proceeding to publish."

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: snapnet-apks
          path: apk

      - name: Compose release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CERT_SHA256: ${{ needs.build.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKS=(apk/*.apk)
          if [ ${#APKS[@]} -ne 4 ]; then
            echo "::error::Expected 4 APKs to publish, found ${#APKS[@]}."
            exit 1
          fi

          # 64-bit first, then 32-bit, so the recommended download is listed at the top.
          ORDER="arm64-v8a armeabi-v7a x86_64 x86"
          {
            echo "نسخة SnapNet $VERSION - أربعة ملفات APK، ملف واحد لكل معمارية."
            echo
            echo "اختر الملف المناسب لجهازك. معظم الأجهزة الحديثة تحتاج **arm64-v8a**."
            echo "للتحقق من معمارية جهازك: الإعدادات ← حول الهاتف ← المعالج، أو استخدم تطبيقًا مثل AIDA64."
            echo
            for abi in $ORDER; do
              for apk in "${APKS[@]}"; do
                case "$(basename "$apk")" in
                  *"-$abi-release.apk")
                    size="$(du -h "$apk" | awk '{print $1}')"
                    hash="$(sha256sum "$apk" | awk '{print $1}')"
                    echo "### $abi"
                    echo "- الملف: \`$(basename "$apk")\`"
                    echo "- الحجم: $size"
                    echo "- SHA-256: \`$hash\`"
                    echo
                    ;;
                esac
              done
            done
            echo "اسم الحزمة (Application ID): \`com.snapnet\`"
            echo
            echo "التوقيع الرقمي: Keystore دائم (SHA-256: $CERT_SHA256)"
            echo
            echo "### التثبيت"
            echo "نزّل ملف الـAPK المناسب لمعمارية جهازك وثبّته مباشرة."
            echo "التوقيع ثابت لكل الإصدارات، لذلك يمكن تثبيت الإصدار الجديد فوق القديم دون حذف التطبيق."
            echo
            echo "### التحقق من السلامة"
            echo '```'
            echo "sha256sum <الملف الذي نزّلته>"
            echo '```'
          } > notes.md
          cat notes.md

      # action-gh-release only ever *adds* assets. An APK that a later revision stops producing -
      # for example the universal APK published before SnapNet moved to one APK per ABI - would
      # otherwise stay on the release forever and keep offering users a stale download. Clearing the
      # release first makes its contents exactly the set that this build produced.
      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG does not exist yet; nothing to clean."
            exit 0
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            -q '.assets[].name' | while IFS= read -r name; do
              [ -n "$name" ] || continue
              echo "removing existing asset: $name"
              gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
            done
          echo "Release $TAG is now empty; the current build's APKs will be attached next."

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: SnapNet ${{ needs.build.outputs.version }}
          body_path: notes.md
          files: apk/*.apk
          draft: false
          prerelease: false
          make_latest: true
